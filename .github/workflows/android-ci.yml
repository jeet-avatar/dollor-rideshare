name: Android CI/CD

# Builds the Dollor rider (:app) and driver (:driver) Android apps.
#
# Required GitHub Actions secrets (names only):
#   ANDROID_GOOGLE_SERVICES_APP_B64     base64 of apps/android/app/google-services.json
#   ANDROID_GOOGLE_SERVICES_DRIVER_B64  base64 of apps/android/driver/google-services.json
# Generate with:  base64 < google-services.json | pbcopy
# Release signing is NOT done in CI; release jobs produce unsigned/debug-signed APKs for smoke checks only.

on:
  push:
    branches: [ main, develop, staging, 'feature/**' ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main, develop, staging ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json files
        env:
          APP_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_APP_B64 }}
          DRIVER_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DRIVER_B64 }}
        run: |
          echo "$APP_JSON_B64" | base64 --decode > app/google-services.json
          echo "$DRIVER_JSON_B64" | base64 --decode > driver/google-services.json

      - name: Run Lint
        run: ./gradlew :app:lintStagingDebug :driver:lintStagingDebug :shared:lint --continue || true
        # Note: Using || true because Android Lint has known bugs with Kotlin test analysis

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: 'apps/android/**/build/reports/lint-results*.html'

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json files
        env:
          APP_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_APP_B64 }}
          DRIVER_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DRIVER_B64 }}
        run: |
          echo "$APP_JSON_B64" | base64 --decode > app/google-services.json
          echo "$DRIVER_JSON_B64" | base64 --decode > driver/google-services.json

      - name: Run Unit Tests
        run: ./gradlew :app:testStagingDebugUnitTest :driver:testStagingDebugUnitTest :shared:testDebugUnitTest --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: 'apps/android/**/build/test-results/**/*.xml'

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    defaults:
      run:
        working-directory: apps/android
    strategy:
      matrix:
        module: [app, driver]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json files
        env:
          APP_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_APP_B64 }}
          DRIVER_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DRIVER_B64 }}
        run: |
          echo "$APP_JSON_B64" | base64 --decode > app/google-services.json
          echo "$DRIVER_JSON_B64" | base64 --decode > driver/google-services.json

      - name: Build Debug APK
        run: ./gradlew :${{ matrix.module }}:assembleStagingDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-debug-apk
          path: apps/android/${{ matrix.module }}/build/outputs/apk/staging/debug/*.apk

  release:
    name: Build Release APKs
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write google-services.json files
        env:
          APP_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_APP_B64 }}
          DRIVER_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DRIVER_B64 }}
        run: |
          echo "$APP_JSON_B64" | base64 --decode > app/google-services.json
          echo "$DRIVER_JSON_B64" | base64 --decode > driver/google-services.json

      - name: Build Release APKs
        run: ./gradlew :app:assembleProductionRelease :driver:assembleProductionRelease

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            apps/android/app/build/outputs/apk/production/release/*.apk
            apps/android/driver/build/outputs/apk/production/release/*.apk

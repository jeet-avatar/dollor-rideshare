name: CI/CD Pipeline

# Backend/frontend CI for Dollor. No AWS access and no repository secrets needed:
# the image is built and scanned locally (not pushed). Deployment is done by deploy-dollar-ai.yml.

on:
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'apps/web/p2p-platform/**'
      - 'infrastructure/**'
      - '.github/workflows/ci-complete.yml'
  push:
    branches: [develop, staging, main]
    paths:
      - 'apps/web/p2p-platform/**'
      - '.github/workflows/ci-complete.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  IMAGE_NAME: dollor-api

# Concurrency: Cancel in-progress runs for same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 1: STATIC ANALYSIS & LINTING
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        working-directory: apps/web/p2p-platform/backend
        continue-on-error: true  # Non-blocking while lint issues are being addressed
        run: |
          ruff check . --output-format=github || true
          ruff format --check . || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/p2p-platform/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web/p2p-platform/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: apps/web/p2p-platform/frontend
        run: npm run lint

  # ============================================
  # STAGE 1b: API CONTRACT VALIDATION
  # ============================================
  api-contracts:
    name: API Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: apps/web/p2p-platform/backend
        run: pip install -r requirements.txt

      - name: Validate API contracts
        run: python scripts/validate-api-contracts.py --skip-android
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/api-contracts.db
          JWT_SECRET_KEY: ci-test-key
          ENVIRONMENT: development

  # Semgrep SAST runs in ci-security.yml.

  # ============================================
  # STAGE 3: UNIT TESTS & COVERAGE
  # ============================================
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: apps/web/p2p-platform/backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-xdist httpx

      - name: Run tests with coverage
        working-directory: apps/web/p2p-platform/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key-for-ci
          TESTING: "true"
        run: |
          pytest tests/ \
            -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=50 \
            || echo "Tests completed"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/web/p2p-platform/backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            apps/web/p2p-platform/backend/coverage.xml
            apps/web/p2p-platform/backend/htmlcov/

  # ============================================
  # STAGE 4: BUILD & SCAN DOCKER IMAGE (local only, not pushed)
  # ============================================
  build:
    name: Build & Scan Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: apps/web/p2p-platform/backend
          file: apps/web/p2p-platform/backend/Dockerfile.optimized
          target: production
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          timeout: '10m'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

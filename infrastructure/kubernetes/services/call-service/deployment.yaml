# Dollor.ai Call Service - Kubernetes Deployment
# ===============================================
# Base deployment configuration for call-service
# Handles voice calling functionality via Twilio/WebRTC

apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-service
  labels:
    app: call-service
    platform: dollor-ai
    app.kubernetes.io/name: call-service
    app.kubernetes.io/component: communication
    app.kubernetes.io/part-of: dollor-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: call-service
  template:
    metadata:
      labels:
        app: call-service
        platform: dollor-ai
        app.kubernetes.io/name: call-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8019"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: call-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: call-service
          image: dollor/call-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8019
              protocol: TCP
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: call-service-config
                  key: ENVIRONMENT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: call-service-secrets
                  key: DATABASE_URL
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: call-service-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: call-service-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: call-service-secrets
                  key: TWILIO_API_KEY
            - name: TWILIO_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: call-service-secrets
                  key: TWILIO_API_SECRET
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: call-service-config
                  key: NOTIFICATION_SERVICE_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: call-service-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - call-service
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: call-service
  labels:
    app: call-service
    platform: dollor-ai
    app.kubernetes.io/name: call-service
spec:
  type: ClusterIP
  ports:
    - port: 8019
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: call-service

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: call-service-config
data:
  ENVIRONMENT: "development"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8009"

---
apiVersion: v1
kind: Secret
metadata:
  name: call-service-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGE_ME_USE_SEALED_SECRETS@postgres:5432/dollor"
  TWILIO_ACCOUNT_SID: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  TWILIO_AUTH_TOKEN: "your_twilio_auth_token"
  TWILIO_API_KEY: "SKxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  TWILIO_API_SECRET: "your_twilio_api_secret"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: call-service
  labels:
    app: call-service
    platform: dollor-ai

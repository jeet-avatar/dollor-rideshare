# Dollor.ai Chat Service - Kubernetes Deployment
# ================================================
# Base deployment configuration for chat-service
# Provides real-time messaging and chat functionality

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  labels:
    app: chat-service
    platform: dollor-ai
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: dollor-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
        platform: dollor-ai
        app.kubernetes.io/name: chat-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8018"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chat-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: chat-service
          image: dollor/chat-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8018
              protocol: TCP
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: chat-service-config
                  key: ENVIRONMENT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chat-service-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chat-service-secrets
                  key: REDIS_URL
            - name: WEBSOCKET_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: chat-service-config
                  key: WEBSOCKET_ENABLED
            - name: MAX_MESSAGE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: chat-service-config
                  key: MAX_MESSAGE_SIZE
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: chat-service-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - chat-service
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  labels:
    app: chat-service
    platform: dollor-ai
    app.kubernetes.io/name: chat-service
spec:
  type: ClusterIP
  ports:
    - port: 8018
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: chat-service

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-service-config
  labels:
    app: chat-service
    platform: dollor-ai
data:
  ENVIRONMENT: "development"
  WEBSOCKET_ENABLED: "true"
  MAX_MESSAGE_SIZE: "10485760"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"

---
apiVersion: v1
kind: Secret
metadata:
  name: chat-service-secrets
  labels:
    app: chat-service
    platform: dollor-ai
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGE_ME_USE_SEALED_SECRETS@postgresql:5432/dollor_chat"
  REDIS_URL: "redis://redis:6379/0"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat-service
  labels:
    app: chat-service
    platform: dollor-ai

# Alembic Configuration - Dollor.ai Enterprise Database Migrations
# ================================================================
# This configuration file manages database schema versioning for
# production, staging, and development environments.

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Truncate revision hashes to this length (default: 40)
truncate_slug_length = 40

# Set to 'true' to run migrations in offline mode (generate SQL without DB connection)
prepend_sys_path = .

# Timezone for migration file names
timezone = UTC

# Max length of each generated revision file (0 = unlimited)
output_encoding = utf-8

# Database URL - loaded from environment via env.py
# DO NOT hardcode credentials here - use DATABASE_URL environment variable
sqlalchemy.url = driver://user:pass@host/dbname

[post_write_hooks]
# Hooks to run after generating migration files

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

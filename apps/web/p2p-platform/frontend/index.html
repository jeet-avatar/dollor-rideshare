<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Dollor - Peer-to-peer rideshare marketplace in California. Post a ride offer, drivers bid, flat $1 to $3 connection fee by fare tier." />
    <meta name="theme-color" content="#ff6b00" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dollor" />

    <!-- Social / OG -->
    <meta property="og:title" content="Dollor - Rideshare California" />
    <meta property="og:description" content="Post a ride offer in California and let drivers bid. Flat $1 to $3 connection fee by fare tier." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dollor.ai" />

    <title>Dollor - Rideshare California</title>
    <style>
      :root {
        --dollor-orange: #ff6b00;
        --dollor-orange-dark: #cc5500;
        --dollor-bg: #0a0a0f;
        --dollor-surface: #111118;
      }

      /* Safe area support for iOS notch */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Prevent tap highlight on mobile */
      * { -webkit-tap-highlight-color: transparent; }

      /* Smooth scrolling */
      html { scroll-behavior: smooth; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Pre-React security check for admin routes -->
    <script>
      (function() {
        try {
          var path = window.location.pathname;
          console.log('[Security] Path:', path);

          // Only check admin routes
          if (path.startsWith('/admin')) {
            var token = localStorage.getItem('token');
            console.log('[Security] Token exists:', !!token);

            // Check for null, undefined, empty string
            if (!token || token === '' || token === 'null' || token === 'undefined') {
              // Show redirect message before redirecting
              document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#1a1a2e;color:white;font-family:sans-serif;"><div style="text-align:center;"><h2>🔐 Authentication Required</h2><p>Redirecting to login...</p></div></div>';
              console.log('[Security] No valid token, redirecting to login');
              setTimeout(function() {
                window.location.href = '/login';
              }, 500);
              return;
            }
            console.log('[Security] Token found, allowing access');
          }
        } catch(e) {
          console.error('[Security] Auth check error:', e);
          document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#1a1a2e;color:white;"><p>Authentication error. Redirecting...</p></div>';
          setTimeout(function() { window.location.href = '/login'; }, 500);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
